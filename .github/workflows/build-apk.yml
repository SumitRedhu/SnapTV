name: Build & Release Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV & Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Compile Web Application Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p app/src/main/assets/web
          cp -r dist/* app/src/main/assets/web/
          echo "Web assets successfully bundled into app/src/main/assets/web"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Prepare Android Build Environment
        run: |
          # 1. Enforce AndroidX in gradle.properties
          if [ ! -f "gradle.properties" ]; then
            echo "Creating gradle.properties..."
            touch gradle.properties
          fi
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          echo "android.useAndroidX=true verified in gradle.properties"

          # 2. Restore debug.keystore from debug.keystore.base64 or generate fallback
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Ensure .env file exists for build environment
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -Djava.awt.headless=true --stacktrace
          else
            gradle assembleDebug -Djava.awt.headless=true --stacktrace
          fi

      - name: Locate and Rename APK
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find .build-outputs/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/SnapTV.apk
            ls -lh release-output/SnapTV.apk
          else
            echo "ERROR: Could not locate built APK!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTV-APK
          path: release-output/SnapTV.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi

          # Unique tag prevents duplicate tag conflicts
          TAG="v${VERSION}-b${{ github.run_number }}"
          TITLE="SnapTV v${VERSION} (Build #${{ github.run_number }})"

          echo "Publishing release: $TAG"
          gh release create "$TAG" release-output/SnapTV.apk \
            --title "$TITLE" \
            --notes "Automated release of SnapTV APK for Android TV and Phones. Standalone serverless mode enabled." \
            --latest
