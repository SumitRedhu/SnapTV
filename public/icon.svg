<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#tvBg)" />

  <!-- Outer TV bezel -->
  <rect x="72" y="96" width="368" height="256" rx="28" fill="#18181b" stroke="#312e81" stroke-width="6" />

  <!-- Inner Screen -->
  <rect x="88" y="112" width="336" height="224" rx="18" fill="#090d16" />

  <!-- Ambient glowing screen backer -->
  <circle cx="256" cy="224" r="80" fill="url(#accentGlow)" opacity="0.3" filter="url(#glow)" />

  <!-- Play Triangle -->
  <polygon points="236,180 296,224 236,268" fill="#ffffff" />

  <!-- Cast Waves (top right of screen) -->
  <path d="M 360 176 A 48 48 0 0 0 312 128" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
  <path d="M 376 176 A 64 64 0 0 0 312 112" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" opacity="0.75" />
  <circle cx="316" cy="172" r="5" fill="#6366f1" />

  <!-- TV Stand Base -->
  <path d="M 216 352 L 192 416 L 320 416 L 296 352 Z" fill="#27272a" />
  <rect x="160" y="412" width="192" height="12" rx="6" fill="#3f3f46" />
</svg>
