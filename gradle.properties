# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.

# Enables modern AndroidX support (required for androidx.* dependencies)
android.useAndroidX=true

# Automatically converts third-party libraries to use AndroidX
android.enableJetifier=true

# JVM memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution and build caching for faster builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin code style
kotlin.code.style=official
